[project]
name = "cortex"
version = "0.2.0"
description = "A local-first AI knowledge vault. Your notes, your machine, your models."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

dependencies = [
    "httpx>=0.27",
    "ollama>=0.6.1",
    "sqlite-vec>=0.1.9",
    "typer>=0.15.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[project.scripts]
cortex = "cortex.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cortex"]
# The built web client is copied to src/cortex/webui before packaging, so an
# installed Cortex serves the app itself - one command, one port, no CORS.
artifacts = ["src/cortex/webui/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "ollama: integration test that needs a running Ollama server",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Function calls in argument defaults are how Typer and FastAPI declare
# options and dependencies. Not a bug in either case.
"src/cortex/cli.py" = ["B008"]
"src/cortex/api/app.py" = ["B008"]
