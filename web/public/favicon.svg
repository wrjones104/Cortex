<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#4f46e5" />
      <stop offset="50%" stopColor="#6366f1" />
      <stop offset="100%" stopColor="#7c3aed" />
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="100%" stopColor="#2563eb" />
    </linearGradient>
  </defs>

  <!-- Background App Badge -->
  <rect width="64" height="64" rx="15" fill="url(#bgGrad)" />

  <!-- Archie the Librarian Owl (Scalable 64x64) -->
  <g transform="translate(4, 3) scale(0.56)">
    <!-- Feather Tufts / Ears -->
    <polygon points="28,38 20,24 36,32" fill="#3730a3" />
    <polygon points="72,38 80,24 64,32" fill="#3730a3" />

    <!-- Main Owl Body -->
    <path
      d="M26 44 C26 32 36 26 50 26 C64 26 74 32 74 44 C74 68 70 86 50 86 C30 86 26 68 26 44 Z"
      fill="#ffffff"
      stroke="#3730a3"
      stroke-width="2"
    />

    <!-- Belly Feathers -->
    <ellipse cx="50" cy="65" rx="16" ry="17" fill="#e0e7ff" />
    <path
      d="M44 58 Q50 62 56 58 M44 66 Q50 70 56 66 M44 74 Q50 78 56 74"
      stroke="#6366f1"
      stroke-width="2.2"
      stroke-linecap="round"
      fill="none"
    />

    <!-- Wings on Sides -->
    <path d="M24 48 C18 56 18 68 25 76" stroke="#4f46e5" stroke-width="4.5" stroke-linecap="round" />
    <path d="M76 48 C82 56 82 68 75 76" stroke="#4f46e5" stroke-width="4.5" stroke-linecap="round" />

    <!-- Big Round Academic Glasses -->
    <circle cx="38" cy="46" r="10.5" fill="#ffffff" stroke="#fbbf24" stroke-width="3.2" />
    <circle cx="62" cy="46" r="10.5" fill="#ffffff" stroke="#fbbf24" stroke-width="3.2" />
    <path d="M48.5 46 L51.5 46" stroke="#fbbf24" stroke-width="3.2" stroke-linecap="round" />

    <!-- Pupils -->
    <circle cx="39" cy="46" r="4.8" fill="#0f172a" />
    <circle cx="63" cy="46" r="4.8" fill="#0f172a" />
    <circle cx="37.5" cy="44.2" r="1.8" fill="#ffffff" />
    <circle cx="61.5" cy="44.2" r="1.8" fill="#ffffff" />

    <!-- Golden Beak -->
    <polygon points="50,51 45,58 55,58" fill="#f59e0b" stroke="#d97706" stroke-width="1" />

    <!-- Scholar Cap -->
    <polygon points="50,13 79,23 50,33 21,23" fill="url(#capGrad)" stroke="#1d4ed8" stroke-width="1.5" />
    <polygon points="50,15 75,23 50,31 25,23" fill="#60a5fa" opacity="0.4" />
    <path d="M47 31 L47 36 Q50 38 53 36 L53 31" fill="#1d4ed8" />

    <!-- Tassel with Spark -->
    <path d="M72 25 L77 38" stroke="#fbbf24" stroke-width="2.8" stroke-linecap="round" />
    <circle cx="77" cy="40" r="3.5" fill="#fbbf24" />

    <!-- Feet -->
    <path d="M42 86 L40 90 M45 86 L45 91 M48 86 L50 90" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />
    <path d="M52 86 L50 90 M55 86 L55 91 M58 86 L60 90" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
